apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tiktok-rankings
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiktok-rankings
  labels:
    app: tiktok-rankings
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiktok-rankings
  template:
    metadata:
      labels:
        app: tiktok-rankings
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: tiktok-rankings
          image: tiktok-rankings:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tiktok-rankings
---
apiVersion: v1
kind: Service
metadata:
  name: tiktok-rankings
  labels:
    app: tiktok-rankings
spec:
  selector:
    app: tiktok-rankings
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tiktok-rankings
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - host: defina-o-host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tiktok-rankings
                port:
                  name: http
