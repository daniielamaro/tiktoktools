name: Build and Deploy

on:
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/tiktok-tools:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/tiktok-tools:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted
    needs: [build-and-publish]
    steps:
      - name: Deploy Frontend
        run: |
          kubectl set image deployment/tiktok-tools tiktok-tools=${{ secrets.DOCKERHUB_USERNAME }}/tiktok-tools:${{ github.sha }} -n tiktok-tools
          kubectl rollout status deployment/tiktok-tools -n tiktok-tools --timeout=120s