<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entrar</title>
  <link rel="stylesheet" href="/dashboard.css" />
</head>
<body>
  <main class="page">
    <header class="hero">
      <p class="eyebrow">TikTok Live Studio</p>
      <h1>Entrar</h1>
      <p class="lede">Use a conta deste computador para acompanhar a sua live.</p>
    </header>
    <section class="panel">
      <form id="auth-form" class="auth-form" data-action="/api/login">
        <div>
          <label for="username">Nome</label>
          <input id="username" name="username" type="text" autocomplete="username" required />
        </div>
        <div>
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit">Entrar</button>
      </form>
      <p id="auth-error" class="auth-error"></p>
      <p class="auth-switch">Ainda não tem conta? <a href="/register">Cadastre-se</a></p>
    </section>
  </main>
  <script src="/auth.js" type="module"></script>
</body>
</html>
