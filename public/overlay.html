<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlay</title>
  <link rel="stylesheet" href="/overlay.css" />
</head>
<body>
  <section class="card" id="card">
    <h1 id="title" hidden>Ranking</h1>
    <ol id="rows"></ol>
    <div id="goal" class="goal" hidden>
      <p id="goal-step" class="goal-step" hidden></p>
      <div class="goal-track" id="goal-track">
        <div class="goal-fill" id="goal-fill"></div>
      </div>
      <div class="goal-meta">
        <span id="goal-counts"></span>
        <span id="goal-percent"></span>
      </div>
      <div id="goal-second" class="goal-second" hidden>
        <p id="goal-second-label" class="goal-step"></p>
        <div class="goal-track" id="goal-track-2">
          <div class="goal-fill" id="goal-fill-2"></div>
        </div>
        <div class="goal-meta">
          <span id="goal-counts-2"></span>
          <span id="goal-percent-2"></span>
        </div>
      </div>
    </div>
    <div id="stage" class="stage" hidden></div>
  </section>
  <script src="/overlay.js" type="module"></script>
</body>
</html>
